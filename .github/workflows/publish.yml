name: Publish to Nuget

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
          
      - name: Restore dependencies
        run: dotnet restore

      - name: Set Versions
        uses: actions/github-script@v4
        id: set_version
        with:
          script: |
            const tag = context.ref.substring(10)
            const no_v = tag.replace('v', '')
            core.setOutput('tag', tag)
            core.setOutput('no-v', no_v)

      - name: Build
        run: dotnet build --configuration Release /p:Version=${{ steps.set_version.outputs.no-v }} 

      - name: Pack
        run: dotnet pack --configuration Release --no-build --output /home/runner/work/PiperSharp/PiperSharp/nupkgs PiperSharp/PiperSharp.csproj

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        run: dotnet nuget push /home/runner/work/PiperSharp/PiperSharp/nupkgs/PiperSharp.${{ steps.set_version.outputs.no-v }}.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
